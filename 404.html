<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140536">
<title>File non trovato — maxbuildthings</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@font-face{font-family:"VT323";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/vt323-latin.woff2) format("woff2")}
:root{--face:#c3c3d8;--hi:#fff;--sh:#5b5b7a;--dk:#1b1033;--ink:#140536}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:20px;font:14px/1.5 Verdana,Tahoma,Geneva,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#140536 0%,#3b0f6b 45%,#ff5fc1 78%,#ffd36e 100%) fixed}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:38vh;pointer-events:none;
  background:linear-gradient(transparent 0 96%,rgba(69,240,255,.7) 96%) 0 0/100% 34px,
             linear-gradient(90deg,transparent 0 97%,rgba(69,240,255,.55) 97%) 0 0/60px 100%;
  transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
.dlg{position:relative;width:min(440px,100%);background:var(--face);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px #e8e8f4,8px 8px 0 rgba(20,5,54,.45)}
.bar{display:flex;align-items:center;gap:8px;margin:3px;padding:3px 4px 3px 8px;color:#fff;font-weight:bold;
  background:linear-gradient(90deg,#6d3cf0,#ff5fc1)}
.bar span{flex:1}
.x{width:20px;height:18px;display:grid;place-items:center;background:var(--face);color:var(--ink);text-decoration:none;font:bold 12px/1 Verdana,sans-serif;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh)}
.body{display:flex;gap:16px;padding:18px 18px 8px}
.ico{flex:none;width:36px;height:36px;border-radius:50%;background:#e0245e;color:#fff;display:grid;place-items:center;font:bold 22px/1 Verdana,sans-serif;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.body p{margin:0 0 10px}
code{font:20px/1.1 "VT323","Courier New",monospace;word-break:break-all}
.acts{display:flex;justify-content:center;gap:10px;padding:8px 18px 18px;flex-wrap:wrap}
.btn{min-width:110px;padding:6px 14px;text-align:center;color:var(--ink);text-decoration:none;background:var(--face);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px #e8e8f4}
.btn:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
.btn:active{box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi)}
</style>
</head>
<body>
<div class="dlg" role="alertdialog" aria-labelledby="t" aria-describedby="d">
  <div class="bar"><span id="t">C:\MAX — Errore</span><a class="x" id="x" href="/" aria-label="Chiudi">×</a></div>
  <div class="body">
    <div class="ico" aria-hidden="true">×</div>
    <div id="d">
      <p><span id="msg">Impossibile trovare il file</span><br><code id="path">C:\MAX\???</code></p>
      <p id="spiega">Forse è stato spostato nel Cestino, o forse non è mai esistito. Succede anche ai migliori.</p>
    </div>
  </div>
  <div class="acts">
    <a class="btn" href="/" autofocus>OK</a>
    <a class="btn" id="vedi" href="/#progetti">Vedi i progetti</a>
  </div>
</div>
<script>
var p=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,"").replace(/\//g,"\\");
if(p)document.getElementById("path").textContent="C:\\MAX\\"+p.slice(0,80);
/* lingua: la stessa scelta del sito (localStorage 'lingua'), altrimenti quella del browser */
var l;try{l=localStorage.getItem("lingua")}catch(e){}
if(l!=="it"&&l!=="en")l=/^it\b/i.test((navigator.languages&&navigator.languages[0])||navigator.language||"it")?"it":"en";
if(l==="en"){var $=function(i){return document.getElementById(i)};
  document.documentElement.lang="en";document.title="File not found — maxbuildthings";
  $("t").textContent="C:\\MAX — Error";$("x").setAttribute("aria-label","Close");
  $("msg").textContent="Cannot find the file";
  $("spiega").textContent="Maybe it ended up in the Recycle Bin, or maybe it never existed. Happens to the best of us.";
  $("vedi").textContent="See the projects";$("vedi").href="/?lang=en#progetti";}
</script>
</body>
</html>
